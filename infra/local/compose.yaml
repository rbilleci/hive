services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hive
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d hive"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "5432:5432"
