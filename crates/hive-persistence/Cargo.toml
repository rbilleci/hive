[package]
name = "hive-persistence"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
hive-application.workspace = true
sea-orm.workspace = true
# `sea_orm::DeriveRelatedEntity` (sea-orm's "seaography" feature) expands code that names
# `seaography::` directly, so an entity module with a `RelatedEntity` enum needs this crate
# available here too, not only in hive-api.
seaography.workspace = true
tokio.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
regex.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
