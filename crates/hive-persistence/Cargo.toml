[package]
name = "hive-persistence"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
hive-domain.workspace = true
hive-application.workspace = true
sea-orm.workspace = true
# `sea_orm::DeriveRelatedEntity` (sea-orm's "seaography" feature) expands code that names
# `seaography::` directly, so an entity module with a `RelatedEntity` enum needs this crate
# available here too, not only in hive-api (a correction to GSR-CRATE-DEPS found in GSR-PHASE-0).
seaography.workspace = true
tokio.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
regex.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
# The one other remaining `sqlx` dependency in the workspace, alongside `hive-api`'s: this crate's
# own `tests/migrator_integration.rs` uses `sqlx`'s simple query API directly to inspect fixture
# state, independent of the production repository layer, which is fully off `sqlx` as of
# `GSR-PHASE-P8`.
sqlx.workspace = true
