[package]
name = "hive-api"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
hive-domain.workspace = true
hive-application.workspace = true
hive-persistence.workspace = true
sea-orm.workspace = true
seaography.workspace = true
async-graphql.workspace = true
anyhow.workspace = true
axum.workspace = true
tower-http.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# The last remaining `sqlx` dependency in the workspace: `tests/http_integration.rs`'s own direct
# fixture-manipulation helpers (inserting/deleting test rows, granting roles) use `sqlx`'s simple
# `.bind()`-chaining API, independent of the production repository layer, which is fully off
# `sqlx` as of `GSR-PHASE-P8`.
sqlx.workspace = true
