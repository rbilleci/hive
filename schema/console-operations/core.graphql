query ConsoleShell {
  consoleContext {
    principal { id subject displayName }
    organizations {
      id
      slug
      displayName
      lifecycleStatus
      projects { id organizationId slug displayName lifecycleStatus }
    }
    capabilities { code scopeType scopeId }
    revision
  }
  displayPreferences { colorScheme density sidebarState }
}

query AccessibleOrganizations(
  $first: Int!
  $after: String
  $filter: AccessibleOrganizationsFilter
) {
  accessibleOrganizations(first: $first, after: $after, filter: $filter) {
    edges { cursor node { id slug displayName lifecycleStatus } }
    pageInfo { hasNextPage endCursor }
  }
}

query OrganizationOverview($id: ID!, $first: Int!, $after: String) {
  organization(id: $id) {
    id
    slug
    displayName
    lifecycleStatus
    projects(first: $first, after: $after) {
      edges { cursor node { id slug displayName lifecycleStatus } }
      pageInfo { hasNextPage endCursor }
      totalCount
    }
  }
}

query OrganizationProjects(
  $id: ID!
  $first: Int
  $after: String
  $last: Int
  $before: String
  $filter: OrganizationProjectFilter
) {
  organization(id: $id) {
    id
    slug
    displayName
    lifecycleStatus
    projects(first: $first, after: $after, last: $last, before: $before, filter: $filter) {
      edges { cursor node { id slug displayName lifecycleStatus } }
      pageInfo { hasNextPage hasPreviousPage endCursor startCursor }
      totalCount
    }
  }
}

query NavigationAgents($id: ID!, $first: Int!, $filter: AgentDirectoryFilter) {
  project(id: $id) {
    agents(first: $first, filter: $filter) {
      edges { node { id displayName lifecycleStatus } }
      pageInfo { hasNextPage }
    }
  }
}

query ProjectAgents(
  $id: ID!
  $first: Int
  $after: String
  $last: Int
  $before: String
  $filter: AgentDirectoryFilter
) {
  project(id: $id) {
    id
    slug
    displayName
    lifecycleStatus
    agents(first: $first, after: $after, last: $last, before: $before, filter: $filter) {
      edges { cursor node { id slug displayName lifecycleStatus latestPublishedVersion model } }
      pageInfo { hasNextPage hasPreviousPage endCursor startCursor }
      totalCount
    }
  }
}

query ProjectDashboard($id: ID!) {
  projectDashboard(id: $id) {
    id
    slug
    displayName
    lifecycleStatus
    activeAgents
    activeDeployments
    failedDeployments
    pendingApprovals
    unhealthyResources
    currentPeriodCost { availability periodStart periodEnd currency amountCents dataAsOf }
  }
}

query AgentOperationalView($projectId: ID!, $agentId: ID!) {
  agentOperationalView(projectId: $projectId, agentId: $agentId) {
    id
    slug
    displayName
    lifecycleStatus
    draftValidation { status errorCount warningCount validatedAt }
    latestPublishedVersion { status version publishedAt }
    aliasTargets { totalCount activeCount }
    activeDeployment { status observedAt }
    recentEvaluation { outcome completedAt }
    runtimeHealth { status observedAt freshness }
  }
}

mutation UpdateDisplayPreferences($input: UpdateDisplayPreferencesInput!) {
  updateDisplayPreferences(input: $input) {
    displayPreferences { colorScheme density sidebarState }
    problems { __typename code message }
  }
}
