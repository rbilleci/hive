fragment DeploymentEnvironmentFields on DeploymentEnvironmentDefinitionVersion {
  id
  stableDefinitionId
  version
  displayName
  logicalEnvironmentClass
  catalogReleaseId
  catalogReleaseDigest
  contentDigest
}

fragment DeploymentEvidenceFields on DeploymentEvidenceSnapshot {
  kind
  digest
  bindingDigest
  expiresAt
  state
}

fragment DeploymentPlanReviewFields on DeploymentPlanReview {
  activeAgentVersionNumber
  changeSummary
  addedDependencyVersions
  removedDependencyVersions
}

fragment DeploymentPlanFields on DeploymentPlan {
  agentVersionId
  agentContentDigest
  environmentDefinitionVersionId
  targetDigest
  planDigest
  packageDigest
  packageReference
  compilerVersion
  catalogReleaseId
  catalogReleaseDigest
  canonicalPlan
  review { ...DeploymentPlanReviewFields }
}

fragment DeploymentPolicyFields on DeploymentPolicySnapshot {
  policyDigest
  policyRevision
  logicalEnvironmentClass
  risk
  bindingDigest
  requiredEvidence
  requiredApprovers
  evaluationRequirementExpiresAt
  evidence { ...DeploymentEvidenceFields }
}

fragment DeploymentRuntimeHealthFields on DeploymentRuntimeHealth {
  status
  summary
  observedAt
  generation
}

fragment DeploymentAttemptFields on DeploymentAttempt {
  id
  number
  status
  generation
  startedAt
  completedAt
  failureCode
  failureSummary
}

fragment DeploymentRollbackTargetFields on DeploymentRollbackTarget {
  deploymentId
  agentVersionId
  agentVersionNumber
  targetDigest
  runtimeHealth { ...DeploymentRuntimeHealthFields }
}

fragment DeploymentFields on Deployment {
  id
  projectId
  agentId
  agentDisplayName
  agentVersionId
  agentVersionNumber
  strategy
  lifecycleStatus
  revision
  projectionRevision
  requestedBy
  requestedAt
  environmentDefinitionVersion { ...DeploymentEnvironmentFields }
  plan { ...DeploymentPlanFields }
  policy { ...DeploymentPolicyFields }
  currentAttempt { ...DeploymentAttemptFields }
  runtimeHealth { ...DeploymentRuntimeHealthFields }
  rollbackTarget { ...DeploymentRollbackTargetFields }
}

fragment DeploymentPreviewFields on DeploymentPreview {
  environmentDefinitionVersion { ...DeploymentEnvironmentFields }
  strategy
  risk
  policyDigest
  policyRevision
  requiredEvidence
  requiredApprovers
  planDigest
  packageDigest
  catalogReleaseId
  catalogReleaseDigest
  agentContentDigest
  targetDigest
  bindingDigest
  currentTarget {
    aliasName
    deploymentId
    agentVersionId
    agentVersionNumber
    targetDigest
    requestedAt
  }
  requirementExpiresAt
  warnings
  compatibility
}

fragment DeploymentTimelineFields on DeploymentTimelineEvent {
  id
  attemptId
  attemptNumber
  sequence
  stage
  status
  message
  source
  occurredAt
}

fragment DeploymentProblemFields on DeploymentProblem {
  __typename
  code
  message
  ... on DeploymentRevisionConflict {
    resourceId
    expectedRevision
    actualRevision
  }
}

fragment DeploymentMutationFields on DeploymentMutationPayload {
  deployment { ...DeploymentFields }
  problems { ...DeploymentProblemFields }
}

fragment ApprovalDecisionFields on ApprovalDecision {
  id
  requirementId
  actorPrincipalId
  decision
  comment
  rejectionReason
  eligibilityCheckedAt
  decidedAt
}

fragment ApprovalRequirementFields on ApprovalRequirement {
  id
  deploymentId
  projectId
  revision
  status
  expiresAt
  satisfiedAt
  rejectedAt
  invalidatedAt
  requesterId
  requester { id subject }
  requiredDistinctApproverCount
  qualifyingApprovalCount
  satisfiedParticipantIds
  satisfiedParticipants { id subject }
  approvalSnapshot {
    policyDigest
    policyRevision
    environmentClass
    risk
    riskLevel
    rule {
      requiredEvidence
      requiredDistinctApproverCount
    }
    target {
      agentVersionId
      agentVersionDigest
      environmentDefinitionVersionId
      environmentDefinitionDigest
      targetDigest
      deploymentPlanDigest
      artifactDigest
    }
    evidence { ...DeploymentEvidenceFields }
    expiresAt
  }
}

fragment ApprovalInboxItemFields on ApprovalInboxItem {
  decisionAvailable
  eligible
  status
  riskLevel
  expiresAt
  requirement { ...ApprovalRequirementFields }
  deployment { ...DeploymentFields }
}

fragment DeploymentApprovalProblemFields on DeploymentApprovalProblem {
  __typename
  code
  message
  ... on ApprovalRequirementRevisionConflict {
    resourceId
    expectedRevision
    actualRevision
  }
}

query DeploymentEnvironments($agentVersionId: ID!) {
  deploymentEnvironmentDefinitionVersions(agentVersionId: $agentVersionId, first: 50) {
    edges {
      node { ...DeploymentEnvironmentFields }
    }
  }
}

query DeploymentPreview($agentVersionId: ID!, $environmentDefinitionVersionId: ID!, $strategy: DeploymentStrategy!) {
  deploymentPreview(
    agentVersionId: $agentVersionId
    environmentDefinitionVersionId: $environmentDefinitionVersionId
    strategy: $strategy
  ) { ...DeploymentPreviewFields }
}

mutation DeployAgentVersion($input: DeployAgentVersionInput!) {
  deployAgentVersion(input: $input) { ...DeploymentMutationFields }
}

mutation CancelDeployment($input: CancelDeploymentInput!) {
  cancelDeployment(input: $input) { ...DeploymentMutationFields }
}

mutation RetryDeployment($input: RetryDeploymentInput!) {
  retryDeployment(input: $input) { ...DeploymentMutationFields }
}

mutation PromoteDeployment($input: PromoteDeploymentInput!) {
  promoteDeployment(input: $input) { ...DeploymentMutationFields }
}

mutation RollbackDeployment($input: RollbackDeploymentInput!) {
  rollbackDeployment(input: $input) { ...DeploymentMutationFields }
}

query Deployments($projectId: ID!, $after: String, $filter: DeploymentFilter) {
  deployments(projectId: $projectId, first: 50, after: $after, filter: $filter) {
    edges {
      cursor
      node { ...DeploymentFields }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query DeploymentPolling($deploymentId: ID!, $after: String) {
  deploymentProjection(deploymentId: $deploymentId, first: 100, after: $after) {
    deployment { ...DeploymentFields }
    timeline {
      edges {
        cursor
        node { ...DeploymentTimelineFields }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

query ApprovalInbox($organizationId: ID, $projectId: ID, $after: String) {
  approvalInbox(organizationId: $organizationId, projectId: $projectId, first: 50, after: $after) {
    edges {
      cursor
      node { ...ApprovalInboxItemFields }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query ApprovalRequirement($approvalRequirementId: ID!) {
  approvalRequirement(approvalRequirementId: $approvalRequirementId) {
    ...ApprovalInboxItemFields
    requirement {
      decisions(first: 20) {
        edges {
          cursor
          node { ...ApprovalDecisionFields }
        }
        pageInfo {
          hasNextPage
          endCursor
        }
      }
    }
  }
}

mutation DecideDeploymentApproval($input: DecideDeploymentApprovalInput!) {
  decideDeploymentApproval(input: $input) {
    decision { ...ApprovalDecisionFields }
    requirement { ...ApprovalRequirementFields }
    deployment { ...DeploymentFields }
    problems { ...DeploymentApprovalProblemFields }
  }
}
